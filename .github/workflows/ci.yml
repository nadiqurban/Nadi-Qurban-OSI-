name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  checks: write   # JUnit results are published as check annotations

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Headless Chrome (spatie/laravel-pdf via Browsershot) cannot use the sandbox on GitHub runners.
      LARAVEL_PDF_NO_SANDBOX: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, zip, gd, exif, bcmath, pdo_sqlite, sockets
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit

      - name: Install npm dependencies & build
        run: |
          npm ci
          npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          # Demo users (DemoUserSeeder) need a password; generate a throwaway one per run.
          sed -i "s/^SEED_USER_PASSWORD=.*/SEED_USER_PASSWORD=Ci$(openssl rand -hex 12)A1/" .env
          grep -q '^SEED_USER_PASSWORD=Ci' .env

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Pest — unit & feature
        run: vendor/bin/pest tests/Unit tests/Feature --log-junit=build/junit-feature.xml

      - name: Pest — browser (Playwright)
        if: success() || failure()
        run: vendor/bin/pest tests/Browser --log-junit=build/junit-browser.xml

      - name: Publish test report
        if: success() || failure()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: 'build/junit-*.xml'
          check_name: Pest results
          include_passed: false
          detailed_summary: true
